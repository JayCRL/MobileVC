name: tests

# DSH 插件那条线：契约漂移检查 + 审批匹配器单测。
on:
  push:
    branches: [main]
    paths:
      - 'apps/dsh/**'
      - 'packages/contract/**'
      - 'scripts/check-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'apps/dsh/**'
      - 'packages/contract/**'
      - 'scripts/check-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: contract drift (TS ↔ Go)
        run: node scripts/check-contract.mjs
      - run: npm test
