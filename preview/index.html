<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F6F8FC">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="application-name" content="MobileVC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MobileVC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <title>MobileVC</title>
  <link rel="stylesheet" href="styles.css?v=20261025k">
  <style id="dsh-startup-critical">html.dsu-lock,html.dsu-lock body{overflow:hidden!important}#dsh-startup-root.dsu-boot{position:fixed;inset:0;z-index:2147483000;background:#000}</style>
</head>
<body>
  <div class="stage">
    <header class="stage-head">
      <div class="stage-kicker">MOBILEVC · MOBILE UI REFERENCE</div>
      <h1>移动端交互还原</h1>
      <p>按 Flutter 源码的 iOS 设计语言重做：浅色、蓝色主色、单一会话界面、底部命令坞。</p>
    </header>

    <div class="phone">
      <div class="screen" id="screen">
        <header class="appbar" id="appbar"></header>
        <div class="top-fade"></div>
        <main class="content" id="content"></main>
        <footer class="dock-wrap" id="dock"></footer>
        <div class="drawer-root" id="drawer-root"></div>
        <div class="sheet-root" id="sheet-root"></div>
        <div class="toast-root" id="toast-root"></div>
      </div>
    </div>
  </div>

  <script>
    if (new URLSearchParams(location.search).has('bare')) {
      document.body.classList.add('bare');
    }
    try {
      const saved = localStorage.getItem('mobilevc.theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.dataset.theme = saved;
      }
    } catch (_) {}
  </script>
  <script>
    // Bundled adaptation of dsh-startup-screen v1.6.0 (MIT, see
    // startup/NOTICE.md). It no longer depends on the plugin's host route,
    // so it works even when /dsh-startup is behind DSH's auth.
    (() => {
      if (new URLSearchParams(location.search).has('nostartup')) return;
      if (location.pathname.startsWith('/mobilevc-preview')) return;

      const KEY = 'mobilevc-startup-at';
      let last = 0;
      try { last = Number(localStorage.getItem(KEY) || 0); } catch (_) {}
      // A PWA/tab launch is a navigation: show the splash. A quick manual
      // reload is a reload: do not replay immediately.
      const navType = performance.getEntriesByType?.('navigation')?.[0]?.type || '';
      if (navType === 'reload' && Date.now() - last < 15000) return;

      const boot = () => {
        try {
          const cfg = {
            enabled: true,
            mode: 'always',
            theme: 'light',
            speed: 1,
            requireInteraction: true,
            allowSkip: true,
            sound: false,
            voice: false,
            bgm: false,
            identity: 'MOBILEVC',
            identityId: 'MOBILEVC',
            accessLevel: '3',
          };
          window.__DSH_STARTUP_BOOT__ = 'mobilevc';
          window.__DSH_STARTUP_VERSION__ = 'mobilevc-1.6.0';
          window.__DSH_STARTUP_SCRIPT_URL__ = '/mobilevc/startup/splash.js';
          window.__DSH_STARTUP__ = cfg;
          document.documentElement.classList.add('dsu-lock');
          const root = document.createElement('div');
          root.id = 'dsh-startup-root';
          root.className = 'dsu-root dsu-boot';
          document.body.appendChild(root);

          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = '/mobilevc/startup/splash.css';
          document.head.appendChild(link);

          const script = document.createElement('script');
          script.src = '/mobilevc/startup/splash.js';
          script.onerror = () => {
            root.remove();
            document.documentElement.classList.remove('dsu-lock');
          };
          document.body.appendChild(script);

          const remember = () => {
            try { localStorage.setItem(KEY, String(Date.now())); } catch (_) {}
          };
          window.addEventListener('dsh-startup:done', remember, { once: true });
          setTimeout(() => {
            if (!window.__DSH_STARTUP_LOADED__ && root.classList.contains('dsu-boot')) {
              root.remove();
              document.documentElement.classList.remove('dsu-lock');
            }
          }, 10000);
        } catch (_) {
          try { document.documentElement.classList.remove('dsu-lock'); } catch (_) {}
        }
      };

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
      else boot();
    })();
  </script>
  <script src="app-live.js?v=20261025y"></script>
</body>
</html>
