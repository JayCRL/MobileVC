name: remote (apps/remote)

# apps/remote 是 Go + Flutter 那条并行产品线。这里只跑它的 Go 静态检查与测试；
# 老的 836 个测试以前从没在 CI 里跑过，这个 workflow 就是补那个缺口。
on:
  push:
    branches: [main]
    paths:
      - 'apps/remote/**'
      - '.github/workflows/remote.yml'
  pull_request:
    paths:
      - 'apps/remote/**'
      - '.github/workflows/remote.yml'

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/remote/go.mod
          cache-dependency-path: apps/remote/go.sum

      - name: go vet
        run: go vet ./...

      # 失败时把关键行写进 job summary：GitHub 的 job summary 可以通过公开的
      # check-runs API 读到，这样没有仓库权限的人（包括自动化）也能定位失败用例。
      - name: go test
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee /tmp/go-test.log
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### go test failures"
              echo '```'
              grep -E '^(--- FAIL|FAIL\s|panic:|    )' /tmp/go-test.log | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: contract module compiles
        working-directory: packages/contract
        run: go vet ./...
